# Societix backend configuration.
#
# Profiles (design.md "Repository Layout" / "Technology Stack"):
#   local  - developer workstation (verbose logging, Swagger UI on)
#   test   - automated tests; the ONLY profile where Hibernate may touch the schema
#   prod   - production (secrets from the environment, schema managed by Flyway only)
#
# Secrets policy (Req 17.5): NO credentials are committed here. Sensitive values are read
# from environment variables via ${VAR} placeholders and loaded at runtime from a secure
# configuration source. Datasource/Flyway specifics are finalized in task 1.3; this file
# only establishes the profile structure and the hbm2ddl policy.

spring:
  application:
    name: societix-backend

  # Fail fast if a referenced profile-specific document is malformed.
  main:
    banner-mode: "off"

# ---------------------------------------------------------------------------
# Server / HTTP (Spring Security server-side sessions — design ADR-3; Req 2.1, 17.8, 17.9).
#
# Session-cookie hardening (base, profile-independent):
#   - http-only:  true  -> the session cookie is never readable by JavaScript, so an XSS flaw
#                          cannot exfiltrate the session (ADR-3). The CSRF token cookie
#                          (XSRF-TOKEN) is intentionally NOT HttpOnly and is configured in code
#                          (SecurityConfig) so the SPA can read and echo it.
#   - same-site:  Lax   -> blocks the cookie on cross-site sub-requests (CSRF defence-in-depth)
#                          while still allowing it on top-level navigations, which is the right
#                          balance for a same-origin SPA the user navigates to directly. (Strict
#                          would break returning to the app via an external link; Lax is the
#                          design's stated default with Strict "where feasible".)
#   - secure:           -> left unset at the base so local/test over plain HTTP still works; the
#                          prod profile pins it to `true` so the cookie is only ever sent over TLS.
#
# forward-headers-strategy=framework makes Spring honour X-Forwarded-Proto/Host/For from the
# TLS-terminating reverse proxy (design "Deployment Architecture"), so the prod channel-security
# check (requiresSecure) and absolute-URL generation see the real client scheme.
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SOCIETIXSESSION
        http-only: true
        same-site: lax

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway in every non-test profile. Overridden only under `test`.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # ---------------------------------------------------------------------------
  # Flyway — the single source of truth for the database schema (design.md
  # "Technology Stack", ADR-2, Req A1/A3/1.1).
  #
  # Base (profile-independent) policy. Connection details are supplied per profile
  # from the datasource; the runtime DB role must be a non-superuser WITHOUT BYPASSRLS
  # (see V1__baseline.sql header and infra/README.md) so the RLS backstop (task 8.2)
  # is enforced.
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    # Migration scripts live in backend/src/main/resources/db/migration and are packaged
    # onto the classpath. This is Flyway's conventional default, stated explicitly so the
    # location is unambiguous and survives any later classpath reshuffling.
    locations: classpath:db/migration
    # Fail fast if the applied history diverges from the scripts on disk.
    validate-on-migrate: true
    # No pre-existing non-empty schema is expected in dev/CI/prod; V1 is the true baseline,
    # so we do NOT auto-baseline. (Set baseline-on-migrate only for adopting a legacy DB.)
    baseline-on-migrate: false

# springdoc / Swagger UI defaults; full gating by role/profile is handled in a later task.
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Observability — Actuator health/probes + Micrometer metrics (Req 21.3; design.md
# "Metrics/health"). This block owns ONLY the management.* tree. Request rate, error
# rate, and latency are captured by Spring Boot's auto-configured `http.server.requests`
# Micrometer timer and scraped via the Prometheus registry endpoint.
#
# Security note: exposure here is the base (safe) default — only non-sensitive endpoints
# are web-exposed. Full authn/authz gating of the actuator endpoints (restricting
# /actuator to operators, protecting the prometheus scrape path) is wired with Spring
# Security in task 10.1; the prod profile below tightens exposure until then.
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # Expose only operational, non-secret endpoints over HTTP. `env`, `beans`,
        # `configprops`, `threaddump`, `heapdump`, etc. remain NOT web-exposed.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Kubernetes-style liveness/readiness probe groups derived from health indicators.
      probes:
        enabled: true
      # `when-authorized` once Security lands (task 10.1); until then details are shown so
      # local/dev operators can see component status. The prod profile overrides to `never`.
      show-details: always
      show-components: always
      group:
        liveness:
          # Liveness = "is the process up?" — a failure here should trigger a restart.
          include: livenessState
        readiness:
          # Readiness = "can it serve traffic?" — gated on DB connectivity so a node is
          # pulled from rotation when its datasource is unavailable.
          include: readinessState,db
  health:
    # Enable the application-lifecycle state indicators that back the probe groups above.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Datasource health (used by the readiness group) is auto-configured by the JDBC starter.
  metrics:
    tags:
      # Stamp every meter with the service name so metrics are attributable in a shared
      # Prometheus/Grafana backend (mirrors the ECS `service.name` used for logs).
      application: societix-backend
    # `http.server.requests` (request count -> rate, `outcome`/`status` tags -> error rate,
    # and the timer -> latency) is auto-provided for Spring MVC. Publish latency percentiles
    # and histogram buckets so p95/p99 and Prometheus `histogram_quantile` are available.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s
  prometheus:
    metrics:
      export:
        enabled: true

# ---------------------------------------------------------------------------
# Structured logging (Req 21.1, 21.2, 21.4, 21.5).
#
# JSON (ECS) output and the readable local/test console are wired in logback-spring.xml; the
# correlation id and society id travel on the SLF4J MDC (set by CorrelationIdFilter and, later, the
# tenant-context filter) and are automatically included on every structured log line.
#
# This key names the service in ECS JSON lines so a log aggregator can attribute them. Secrets/PII
# must never be logged (Req 21.4); audit records are persisted by the Audit_Service, never emitted
# as log lines (Req 21.5).
# ---------------------------------------------------------------------------
logging:
  structured:
    ecs:
      service:
        name: societix-backend

---
# ---------------------------------------------------------------------------
# local profile
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # Datasource comes from the environment (Req A3). Local defaults ease first-run dev;
    # the connecting role is the non-superuser runtime role (see V1__baseline.sql header).
    url: ${SOCIETIX_DB_URL:jdbc:postgresql://localhost:5432/societix}
    username: ${SOCIETIX_DB_USERNAME:societix}
    password: ${SOCIETIX_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    # Flyway migrates the local database on startup against the datasource above.
    enabled: true
    # `clean` is a destructive operation; disabled so an accidental clean cannot wipe a dev DB.
    clean-disabled: true

logging:
  level:
    com.societix: DEBUG

springdoc:
  swagger-ui:
    enabled: true

---
# ---------------------------------------------------------------------------
# test profile — the only profile permitted to let Hibernate manage the schema
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      # Integration tests may use a throwaway schema (e.g. Testcontainers). Flyway still
      # runs in dedicated migration tests (task 1.4); unit tests can rely on this.
      ddl-auto: create-drop
    show-sql: false
  flyway:
    # Default test profile relies on Hibernate's throwaway schema (create-drop above), so
    # Flyway is OFF here to avoid conflicting with that schema. The dedicated migration
    # test harness (task 1.4) re-enables Flyway against a fresh PostgreSQL container to
    # verify the scripts apply cleanly.
    enabled: false

logging:
  level:
    com.societix: DEBUG

---
# ---------------------------------------------------------------------------
# prod profile — all connection details and secrets come from the environment
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # All connection details come from the environment; no defaults in prod (Req A3, 17.5).
    # This role is the non-superuser runtime role WITHOUT BYPASSRLS (see V1__baseline.sql).
    url: ${SOCIETIX_DB_URL}
    username: ${SOCIETIX_DB_USERNAME}
    password: ${SOCIETIX_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    # Migrations are validated against history and applied at startup. `clean` is disabled
    # so a production schema can never be dropped by an accidental or malicious clean call.
    clean-disabled: true
    validate-on-migrate: true

  # Prod session cookie: only ever sent over TLS (the reverse proxy terminates HTTPS and the
  # app rejects plain HTTP at the edge — see SecurityConfig requiresSecure + Req 17.9).
  servlet:
    session:
      cookie:
        secure: true

# Prod actuator exposure, now gated by Spring Security (task 10.1 enforces what task 2.3 promised):
#   - the Prometheus scrape + metrics endpoints are RE-ENABLED over HTTP but are no longer public;
#     SecurityConfig requires authentication for everything under /actuator/** in prod, while
#     /actuator/health (+ liveness/readiness probe sub-paths) stays public for the orchestrator.
#   - health still leaks no component/detail to unauthenticated callers.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
    com.societix: INFO

springdoc:
  swagger-ui:
    enabled: false
